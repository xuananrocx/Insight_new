app:
  name: Insight
  version: 0.1.1
  log_level: INFO
ui:
  # 默认展示的知识库 ID。null/空字符串 = 使用 is_default 字段标记的 KB（当前是「内置知识库」）。
  # 配置具体 kb_id 后，提问页和文档库页会默认选中该 KB。
  default_kb_id: null
server:
  api_host: 127.0.0.1
  api_port: 8000
  web_host: 127.0.0.1
  web_port: 8501
paths:
  feed_folder: ~/AMD-Knowledge-Feeds
  vector_db: ./data/vector_db
  extracted: ./data/extracted
  feedback_queue: ./data/feedback_queue
  raw_uploads: ./data/raw_uploads
  metadata_db: ./data/metadata.db
  cache: ./data/cache
feature_flags:
  knowledge_base:
    enabled: true
    auto_extract_package: true
    image_ocr: false
  qa:
    enabled: true
    web_ui: true
    show_sources: true
    feedback_buttons: true
  feedback_loop:
    manual_feedback: true
    log_feedback: false
    auto_feedback:
      enabled: false
      require_approval: true
      min_confidence: 0.85
  realtime_watch: false
  batch_upload:
    auto_ingest: true  # 批量上传后是否自动 ingest（false=只放投喂目录，需手动扫描）
  ai_call_log:
    enabled: true              # 全局总开关
    log_response: true         # 是否记响应
    log_system_prompt: true    # 是否记 system prompt
    log_messages: true         # 是否记 messages
    retention_days: 30         # 保留天数（超过自动清理）
    scenes:
      qa_chat: true
      summarize: true
      concept_extract: true
      title: true
      test: false              # 测试场景默认不记
llm:
  chat_provider: deepseek
  embedding:
    mode: local
    local_model: BAAI/bge-base-zh-v1.5
    device: cpu
    cache_size: 1
    available_models:
    - name: BAAI/bge-small-zh-v1.5
      label: BGE-Small-中文
      size: 93MB
      dimensions: 512
      description: 速度快，中文好，推荐默认
    - name: BAAI/bge-base-zh-v1.5
      label: BGE-Base-中文
      size: 400MB
      dimensions: 768
      description: 精度更高，速度稍慢
    - name: BAAI/bge-large-zh-v1.5
      label: BGE-Large-中文
      size: 1.2GB
      dimensions: 1024
      description: 最高精度，适合大批量文档
  fallback_chain:
  - deepseek
  - qwen
  - moonshot
  - anthropic
  - anthropic-arch
  providers:
    deepseek:
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com/v1
      chat_model: deepseek-chat
      embedding_model: false
      max_tokens: 4096
      temperature: 0.3
      enabled: true
    qwen:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat_model: qwen-plus
      embedding_model: text-embedding-v3
      embedding_dimensions: 1024
      max_tokens: 4096
      temperature: 0.3
      enabled: true
    moonshot:
      api_key_env: MOONSHOT_API_KEY
      base_url: https://api.moonshot.cn/v1
      chat_model: moonshot-v1-32k
      embedding_model: false
      max_tokens: 4096
      temperature: 0.3
      enabled: false
    openai:
      api_key_env: OPENAI_API_KEY
      base_url: https://api.openai.com/v1
      chat_model: gpt-4o-mini
      embedding_model: text-embedding-3-small
      embedding_dimensions: 1536
      max_tokens: 4096
      temperature: 0.3
      enabled: false
    local:
      api_key_env: null
      base_url: http://localhost:11434/v1
      chat_model: qwen2.5:14b
      embedding_model: nomic-embed-text
      embedding_dimensions: 768
      max_tokens: 4096
      temperature: 0.3
      enabled: false
    anthropic:
      protocol: anthropic
      api_key_env: ANTHROPIC_API_KEY
      base_url: https://api.anthropic.com
      chat_model: claude-sonnet-4-20250514
      embedding_model: false
      max_tokens: 4096
      temperature: 0.3
      enabled: false
    anthropic-arch:
      protocol: anthropic-arch
      api_key_env: ANTHROPIC_AUTH_TOKEN
      base_url: https://plan.ai.archforce.cn
      chat_model: glm-5.2
      embedding_model: false
      max_tokens: 4096
      temperature: 0.3
      enabled: true
    glm:
      protocol: openai
      api_key_env: ZHIPU_API_KEY
      base_url: https://open.bigmodel.cn/api/paas/v4
      chat_model: glm-4-flash
      embedding_model: false
      max_tokens: 4096
      temperature: 0.3
      enabled: false
ingest:
  text_extensions:
  - md
  - markdown
  - txt
  - rst
  - log
  - pdf
  - docx
  - xlsx
  - xlsm
  - pptx
  - html
  - htm
  - xml
  - json
  - yaml
  - yml
  - ini
  - conf
  - cfg
  - toml
  - properties
  - csv
  - tsv
  - env
  - py
  - sh
  - bash
  - js
  - ts
  - go
  - java
  - c
  - cpp
  - h
  - hpp
  - sql
  max_file_size_mb: 50
  chunking:
    chunk_size: 800
    chunk_overlap: 200
  ai_summary:
    enabled: false
    min_word_count: 100
qa:
  top_k: 5
  similarity_threshold: 0.3
  hybrid_search: true
  rerank:
    enabled: true
    model_name: BAAI/bge-reranker-v2-m3
    retrieve_multiplier: 4
  chat_options:
    temperature: 0.2
    max_tokens: 1500
  system_prompt: ''
