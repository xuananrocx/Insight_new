app:
  name: Insight
  version: 0.1.2
  log_level: INFO
ui:
  # 默认展示的知识库 ID。null/空字符串 = 使用 is_default 字段标记的 KB（当前是「内置知识库」）。
  # 配置具体 kb_id 后，提问页和文档库页会默认选中该 KB。
  default_kb_id: null
server:
  api_host: 127.0.0.1
  api_port: 8000
  web_host: 127.0.0.1
  web_port: 8501
paths:
  feed_folder: ~/Insight_Knowledge_Feeds
  vector_db: ./data/vector_db
  extracted: ./data/extracted
  feedback_queue: ./data/feedback_queue
  raw_uploads: ./data/raw_uploads
  metadata_db: ./data/metadata.db
  cache: ./data/cache
feature_flags:
  knowledge_base:
    enabled: true
    auto_extract_package: true
    image_ocr: false
  qa:
    enabled: true
    web_ui: true
    show_sources: true
    feedback_buttons: true
  feedback_loop:
    manual_feedback: true
    log_feedback: false
    auto_feedback:
      enabled: false
      require_approval: true
      min_confidence: 0.85
  realtime_watch: false
  batch_upload:
    auto_ingest: true  # 批量上传后是否自动 ingest（false=只放投喂目录，需手动扫描）
  ai_call_log:
    enabled: true              # 全局总开关
    log_response: true         # 是否记响应
    log_system_prompt: true    # 是否记 system prompt
    log_messages: true         # 是否记 messages
    retention_days: 30         # 保留天数（超过自动清理）
    scenes:
      qa_chat: true
      summarize: true
      concept_extract: true
      title: true
      test: false              # 测试场景默认不记
llm:
  chat_provider: deepseek
  embedding:
    mode: local
    local_model: BAAI/bge-base-zh-v1.5
    device: cpu
    cache_size: 1
    available_models:
    - name: BAAI/bge-small-zh-v1.5
      label: BGE-Small-中文
      size: 93MB
      dimensions: 512
      description: 速度快，中文好，推荐默认
    - name: BAAI/bge-base-zh-v1.5
      label: BGE-Base-中文
      size: 400MB
      dimensions: 768
      description: 精度更高，速度稍慢
    - name: BAAI/bge-large-zh-v1.5
      label: BGE-Large-中文
      size: 1.2GB
      dimensions: 1024
      description: 最高精度，适合大批量文档
  # 正式对话请求超时（秒）。流式请求 = 相邻数据包最大间隔
  request_timeout_seconds: 120
  # 连接测试超时（秒）。建议短，快速暴露不可达/错配
  test_timeout_seconds: 10
  fallback_chain:
  - deepseek
  - openai
  - glm
  - anthropic
  - custom
  providers:
    deepseek:
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com/v1
      chat_model: deepseek-chat
      embedding_model: false
      max_tokens: 4096
      temperature: 0.3
    # OpenAI 格式。base_url 支持三种填法，自动识别：
    #   https://xxx/v1                    → 走 chat/completions
    #   https://xxx/v1/chat/completions   → 走 chat/completions
    #   https://xxx/v1/responses          → 走 Responses API
    openai:
      api_key_env: OPENAI_API_KEY
      base_url: https://api.openai.com/v1
      chat_model: gpt-4o-mini
      embedding_model: text-embedding-3-small
      embedding_dimensions: 1536
      max_tokens: 4096
      temperature: 0.3
    anthropic:
      protocol: anthropic
      api_key_env: ANTHROPIC_API_KEY
      base_url: https://api.anthropic.com
      chat_model: claude-sonnet-4-20250514
      embedding_model: false
      max_tokens: 4096
      temperature: 0.3
    glm:
      protocol: openai
      api_key_env: ZHIPU_API_KEY
      base_url: https://open.bigmodel.cn/api/paas/v4
      chat_model: glm-4-flash
      embedding_model: false
      max_tokens: 4096
      temperature: 0.3
    # 第三方自定义。protocol 可选：openai / anthropic / anthropic-arch（伪装 Claude Code）
    custom:
      protocol: openai
      api_key_env: CUSTOM_API_KEY
      base_url: ''
      chat_model: ''
      embedding_model: false
      max_tokens: 4096
      temperature: 0.3
ingest:
  text_extensions:
  - md
  - markdown
  - txt
  - rst
  - log
  - pdf
  - docx
  - xlsx
  - xlsm
  - pptx
  - html
  - htm
  - xml
  - json
  - yaml
  - yml
  - ini
  - conf
  - cfg
  - toml
  - properties
  - csv
  - tsv
  - env
  - py
  - sh
  - bash
  - js
  - ts
  - go
  - java
  - c
  - cpp
  - h
  - hpp
  - sql
  max_file_size_mb: 50
  chunking:
    chunk_size: 800
    chunk_overlap: 200
  ai_summary:
    enabled: false
    min_word_count: 100
    # 文档摘要的分段上限（字符）：不超过该值的文档单次 LLM 调用全文直出；
    # 超过则按章节分段 map-reduce（每段出要点笔记再汇总），全文覆盖不截断。
    # 段长只影响调用粒度与成本，调大可减少调用次数（需 provider 上下文足够）。
    segment_chars: 30000
qa:
  top_k: 5
  # 普通/深度检索支持按业务配置术语别名；旧 AI 增强继续使用原检索流程。
  retrieval:
    aliases: {}
    rerank_candidates: 24
    rerank_batch_size: 4
    rerank_seconds: 20
  # 独立的深度 AI 流程；已有用户配置缺少此节时使用同样的代码默认值。
  deep_ai:
    top_k: 8
    context_chars: 20000
    max_tokens: 4096
    step_timeout_seconds: 20
    generation_timeout_seconds: 60
    verification_timeout_seconds: 45
    total_timeout_seconds: 180
  similarity_threshold: 0.3
  hybrid_search: true
  rerank:
    enabled: true
    model_name: BAAI/bge-reranker-v2-m3
    # auto: 优先 ONNX int8（快 ~12x），加载失败回退 CrossEncoder；onnx: 强制 ONNX；torch: 强制 CrossEncoder
    backend: auto
    retrieve_multiplier: 4
  chat_options:
    temperature: 0.2
    max_tokens: 1500
  system_prompt: ''
