name: Build selected platforms
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source commit SHA
        required: true
        type: string
      windows:
        description: Windows x64 installer
        type: boolean
        default: false
      macos:
        description: macOS ARM64 disk image
        type: boolean
        default: false
      linux:
        description: Linux AMD64 deployment bundle
        type: boolean
        default: false
      linux_bootstrap:
        description: Prepare public pinned Linux materials on runner (no repository secrets needed)
        type: boolean
        default: true
      linux_package:
        description: Linux bundle kind
        type: choice
        options: [upgrade, full]
        default: upgrade
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - id: select
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          LINUX: ${{ inputs.linux }}
          LINUX_BOOTSTRAP: ${{ inputs.linux_bootstrap }}
          INSIGHT_RUNTIME_IMAGE: ${{ vars.INSIGHT_RUNTIME_IMAGE }}
          INSIGHT_WEB_IMAGE: ${{ vars.INSIGHT_WEB_IMAGE }}
          INSIGHT_MODELS_URL: ${{ secrets.INSIGHT_MODELS_URL }}
          INSIGHT_MODELS_SHA256: ${{ vars.INSIGHT_MODELS_SHA256 }}
        run: |
          python3 - <<'PY'
          import json, os, re
          env = os.environ
          sha = env['SOURCE_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('Provide a full lowercase commit SHA')
          runners = {'windows': 'windows-2022', 'macos': 'macos-15', 'linux': 'ubuntu-24.04'}
          selected = [{'platform': p, 'runner': r} for p, r in runners.items() if env[p.upper()] == 'true']
          if not selected:
              raise SystemExit('Select at least one platform')
          if env['LINUX'] == 'true' and env['LINUX_BOOTSTRAP'] != 'true':
              for key in ('INSIGHT_RUNTIME_IMAGE', 'INSIGHT_WEB_IMAGE'):
                  if not re.fullmatch(r'[^\s]+@sha256:[0-9a-f]{64}', env[key]):
                      raise SystemExit('Configure a digest-pinned registry image: ' + key)
              if not env['INSIGHT_MODELS_URL'].startswith('https://') or not re.fullmatch('[0-9a-f]{64}', env['INSIGHT_MODELS_SHA256']):
                  raise SystemExit('Configure HTTPS model archive secret and SHA256 variable')
          with open(env['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'include': selected}) + '\nsha=' + sha + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - run: python3 scripts/check_release.py
  build:
    needs: prepare
    env:
      PYTHONUTF8: '1'
      INSIGHT_RUNTIME_IMAGE: ${{ vars.INSIGHT_RUNTIME_IMAGE }}
      INSIGHT_WEB_IMAGE: ${{ vars.INSIGHT_WEB_IMAGE }}
      INSIGHT_MODELS_URL: ${{ secrets.INSIGHT_MODELS_URL }}
      INSIGHT_MODELS_SHA256: ${{ vars.INSIGHT_MODELS_SHA256 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - name: Install desktop build dependencies
        if: matrix.platform != 'linux'
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0 numpy==1.26.4 transformers==4.46.3 posthog==3.25.0
      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis --version=3.10 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH
      - name: Prepare public Linux build materials
        if: matrix.platform == 'linux' && inputs.linux_bootstrap
        run: python scripts/prepare_linux_ci.py --work "$RUNNER_TEMP/insight-materials"
      - name: Build candidate
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          LINUX_PACKAGE: ${{ inputs.linux_package }}
        run: python scripts/release_build.py --platform "$TARGET_PLATFORM" --revision "$SOURCE_SHA" --linux-package "$LINUX_PACKAGE" --work "$RUNNER_TEMP/insight-work" --output "$RUNNER_TEMP/insight-output"
      - name: Smoke test Linux candidate
        if: matrix.platform == 'linux'
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python scripts/smoke_linux_ci.py --image "insight:build-$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/insight-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Record platform result
        if: always()
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          env = os.environ
          folder = pathlib.Path(env['RUNNER_TEMP']) / 'platform-result'
          folder.mkdir(exist_ok=True)
          (folder / (env['TARGET_PLATFORM'] + '.json')).write_text(json.dumps(dict(platform=env['TARGET_PLATFORM'], revision=env['SOURCE_SHA'], result=env['BUILD_RESULT'])), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-result/
          if-no-files-found: error
  summary:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: ${{ runner.temp }}/platform-results
      - name: Summarize selected platforms
        env:
          SELECTED_MATRIX: ${{ needs.prepare.outputs.matrix }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/release_summary.py --results "$RUNNER_TEMP/platform-results" --output "$RUNNER_TEMP/release-summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-summary.json
          if-no-files-found: error
