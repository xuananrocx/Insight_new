name: Build Insight

# 触发：手动 + 推 v* tag（如 v0.1.1）+ PR 到 main
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(python -c "from src import __version__; print(__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Detected version: $v"

      - name: Build app (PyInstaller)
        run: pyinstaller build/insight.spec --noconfirm

      - name: Package macOS .dmg
        run: |
          V="${{ steps.ver.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" dist/Insight.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleVersion" dist/Insight.app/Contents/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" dist/Insight.app/Contents/Info.plist
          codesign --force --deep --sign - dist/Insight.app
          rm -rf dmg-staging && mkdir dmg-staging
          ditto dist/Insight.app dmg-staging/Insight.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Insight" -srcfolder dmg-staging -ov -format UDZO Insight-macOS.dmg
          ls -lh Insight-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Insight-macOS.dmg
          path: Insight-macOS.dmg
          retention-days: 30

  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    continue-on-error: true   # Windows NSIS 不稳定，失败不阻塞 macOS 发布
    env:
      PYTHONUTF8: '1'   # 强制 UTF-8，防止 spec 里非 ASCII 字符在 Windows cp1252 控制台触发 UnicodeEncodeError
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(python -c "from src import __version__; print(__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build app (PyInstaller)
        run: pyinstaller build/insight.spec --noconfirm

      - name: Install NSIS
        shell: bash
        run: |
          curl -L -o nsis-setup.exe "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10-setup.exe/download"
          "./nsis-setup.exe" //S //D=C:\\NSIS
          ls -la C:\\NSIS\\makensis.exe
          echo "C:\\NSIS" >> "$GITHUB_PATH"

      - name: Package Windows installer
        shell: bash
        run: |
          "C:\\NSIS\\makensis.exe" -DAPPVERSION="${{ steps.ver.outputs.version }}" build/insight.nsi
          ls -lh Insight-Windows.exe

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Insight-Windows.exe
          path: Insight-Windows.exe
          retention-days: 30

  # 发布 job：只等 macOS 成功就发布（Windows continue-on-error，失败也不阻塞）
  release:
    name: Publish Release
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Insight-macOS.dmg
          path: release-assets

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Insight-macOS.dmg
          draft: false
          generate_release_notes: true
